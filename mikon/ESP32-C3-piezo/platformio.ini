; ===============================================================
; Smart Safe Walking Path — Uji Sensor Piezo (ESP32-C3 Super Mini)
; ===============================================================
; Board "esp32-c3-devkitm-1" dipakai untuk ESP32-C3 Super Mini:
; chip sama (ESP32-C3, 4MB flash), hanya bentuk board yang berbeda.

[env:esp32c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Beberapa Super Mini (clone) gagal boot dengan mode QIO bawaan,
; DIO lebih lambat sedikit tetapi kompatibel dengan semua varian.
board_build.flash_mode = dio

; Super Mini TIDAK punya chip USB-to-Serial (CH340/CP2102).
; USB terhubung langsung ke chip ESP32-C3 (USB CDC bawaan),
; jadi dua flag ini WAJIB agar Serial.print() muncul lewat kabel USB.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; upload_port / monitor_port sengaja tidak diisi: PlatformIO akan
; mendeteksi otomatis. Jika salah port, isi manual, contoh:
; upload_port = COM8
; monitor_port = COM8
