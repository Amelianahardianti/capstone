# Broker MQTT lokal untuk ESP32 penyeberangan + CV (testvid_fixed.py).
# Nyalakan Mobile hotspot Windows ("cameliaa", 2.4 GHz) DULU, baru jalankan dari folder ini:
#   "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
# Broker hanya mendengarkan di localhost (CV) dan di hotspot laptop 192.168.137.1 (ESP32),
# jadi tidak terlihat dari jaringan kampus (UGM-Hotspot). Tanpa password: hotspot sudah ber-WPA2.
listener 1883 127.0.0.1
listener 1883 192.168.137.1
allow_anonymous true
