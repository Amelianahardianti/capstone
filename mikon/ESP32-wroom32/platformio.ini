; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Dua ESP memakai kode yang sama, hanya beda NODE_ID, ADA_BUZZER & port upload.
;   pio run -e node_a -t upload
;   pio run -e node_b -t upload

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
; Timestamp jam PC di tiap baris, untuk membandingkan log node_a & node_b
monitor_filters = time

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
    https://github.com/avishorp/TM1637.git

; ESP yang terhubung ke traffic light (punya buzzer di GPIO13)
[env:node_a]
upload_port = COM8
monitor_port = COM8
build_flags = -D NODE_ID=\"A\" -D ADA_BUZZER=1

; ESP sisi seberang (belum terhubung ke traffic light, tanpa buzzer)
[env:node_b]
upload_port = COM14
monitor_port = COM14
build_flags = -D NODE_ID=\"B\" -D ADA_BUZZER=0
